[project]
name = "nanomoe"
version = "0.1.0"
description = "Nano Mixture-of-Experts (MoE) LLM built from scratch."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch~=2.11.0",
    "numpy>=2.4",
    "einops>=0.8",
    "einx>=0.4",
    "jaxtyping>=0.3",
    "regex>=2026.3.32",
    "tiktoken>=0.12.0",
    "gigatoken",
    "tqdm>=4.67",
    "wandb>=0.25",
    "prettytable>=3.10.0",
    "datasets>=3.0.0",
    "modal>=1.5.3",
    "matplotlib>=3.11.1",
    "safetensors>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
python-preference = "managed"
